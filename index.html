<!DOCTYPE html>
<html>
<head>
    <title>Expense Calculator</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #d1f0f4;
        }
        .box {
            width: 500px;
            height: 500px;
            margin: 50px auto;
            background: white;
            padding: 15px;
            border: 1px solid black;
            border-radius: 10%;
            box-shadow: 5px 5px 10px gray;
            box-sizing: border-box;
        }
        input, select, button {
            margin: 5px;
            padding: 5px;
        }
        button {
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #result {
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Personal Expense Calculator</h2>
        <input type="number" id="income" placeholder="Enter Income">
        <br>
        <input type="text" id="name" placeholder="Expense Name">
        <br>
        <input type="number" id="amount" placeholder="Amount">
        <br>
        <select id="category">
            <option>Food</option>
            <option>Travel</option>
            <option>Education</option>
            <option>Shopping</option>
            <option>Others</option>
        </select>
        <br>
        <button onclick="showResult()">Calculate</button>
        <button onclick="clearData()">Clear</button>
        <div id="result"></div>
    </div>
    <script>
        let total = 0;
        function showResult() {
            let income = Number(
                document.getElementById("income").value
            );
            let name = document.getElementById("name").value;
            let amount = Number(
                document.getElementById("amount").value
            );
            let category =
                document.getElementById("category").value;
            if (income <= 0) {
                alert("Enter income first");
                return;
            }
            if (name == "") {
                alert("Enter expense name");
                return;
            }
            if (amount <= 0) {
                alert("Enter expense amount");
                return;
            }
            total = total + amount;
            let savings = income - total;
            document.getElementById("result").innerHTML =
                "<h3>Summary Report</h3>" +
                "Expense Name: " + name + "<br>" +
                "Category: " + category + "<br>" +
                "Expense Amount: ₹" + amount + "<br>" +
                "Total Expense: ₹" + total + "<br>" +
                "Savings: ₹" + savings;
        }
        function clearData() {
            document.getElementById("income").value = "";
            document.getElementById("name").value = "";
            document.getElementById("amount").value = "";
            document.getElementById("category").selectedIndex = 0;
            document.getElementById("result").innerHTML = "";
            total = 0;
        }
    </script>
</body>
</html>
